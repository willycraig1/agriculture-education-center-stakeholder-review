<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red House Sheet</title>
<!-- Arch D (36" x 24") sheet A-1: the Red House at Levels 3, 2, and 1 (left to right), turned 90 deg counter-clockwise, at 1/16" = 1'-0", with the
     program colours. Built as one SVG in points (2592 x 1728) whose top-level groups open in Illustrator as named
     layers: Program_colors (one group per Level, under the plans), Plans, Labels, Titleblock.
     Printed to PDF and saved as SVG by tools/export_red_house_sheet.py. Plans as on slides/red-house.html. -->
<style>
  @page { size: 36in 24in; margin: 0; }
  html, body { margin: 0; background: #fff; }
  svg#sheet { display: block; width: 36in; height: 24in; }
</style>
</head>
<body>
<script src="../slides/data/red-house.js"></script>
<script>
(function () {
  const R = window.RED_HOUSE, FT = R.ft_per_pt;
  const q = new URLSearchParams(location.search), date = q.get("date") || new Date().toISOString().slice(0, 10);
  const PT = 72, W = 36 * PT, H = 24 * PT, M = .5 * PT, TB = 2.6 * PT;
  const k = (1 / 16) * PT * FT;                       // paper points per plan unit at 1/16" = 1'-0"
  const ink = "#2B2A26", muted = "#77736A", line = "#B9B3A6", red = "#A63A2B";
  const sans = "'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif", serif = "'Iowan Old Style', Palatino, Georgia, serif";
  const PROG = { circulation: ["#F2CF4E", "Circulation"], restroom: ["#7FB6E0", "Restrooms"], primary: ["#E07B6E", "Primary spaces"],
                 office: ["#9CC98A", "Offices"], kitchen: ["#F0A85A", "Kitchen support"], storage: ["#BDB8B0", "Storage and ancillary"] };
  const TEXT = [
    null,
    { b: "Level 1", h: "Lightest touch", p: "Lobby, conference room, demo kitchen, four offices, commons, breakroom, two accessible restrooms; instructional classroom under a new roof to the east, linked by a covered walkway." },
    { b: "Level 2", h: "Better management", p: "Adds Office 5 and separate men's and women's restrooms beside the classroom." },
    { b: "Level 3", h: "Best case", p: "New classroom and event building with its own restrooms and storage across a patio; the old classroom bay becomes an equipment carport; breakroom beside the commons." },
  ];
  // line weights in paper points, converted to plan units
  const w = pt => (pt / k).toFixed(2);
  const style = { below: `stroke="#cfc8b8" stroke-width="${w(.25)}"`, above: `stroke="${line}" stroke-width="${w(.25)}"`,
                  furniture: `stroke="${line}" stroke-width="${w(.25)}"`, fixtures: `stroke="${ink}" stroke-width="${w(.35)}"`,
                  openings: `stroke="${ink}" stroke-width="${w(.35)}"`, walls: `stroke="${ink}" stroke-width="${w(1)}" stroke-linejoin="round"`,
                  new: `stroke="${red}" stroke-width="${w(2)}" stroke-linejoin="round"` };

  // measure each Level on its walls (as the slide frames them), in a scratch SVG
  const scratch = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  document.body.appendChild(scratch);
  const box = l => {
    scratch.innerHTML = ["walls", "new", "above"].map(p => l[p] ? `<g>${l[p]}</g>` : "").join("");
    let b = null;
    scratch.querySelectorAll(":scope > g").forEach(g => { const r = g.getBBox(); if (!r.width) return;
      b = b ? [Math.min(b[0], r.x), Math.min(b[1], r.y), Math.max(b[2], r.x + r.width), Math.max(b[3], r.y + r.height)] : [r.x, r.y, r.x + r.width, r.y + r.height]; });
    return b;
  };
  const levels = [1, 2, 3].map(i => ({ i, l: R.levels[i], b: box(R.levels[i]) }));
  scratch.remove();

  // three slots across the drawing area, Level 3 on the left; each plan turned 90 deg counter-clockwise so it reads
  // with the sheet's right edge as its bottom; titles sit below each plan (reading), to its right on the sheet
  const ax0 = M + 2, ay0 = M + 2, aw = W - 2 * M - 4, ah = H - 2 * M - 4 - TB, slot = aw / 3, titleD = 1.25 * PT, gap = .35 * PT;
  // the Levels are registered to one another (same plan frame), so all three are placed on Level 1's box: the house
  // lines up across the sheet and Level 3's addition runs past the shared edge
  const ref = levels[0].b, rcy = (ref[1] + ref[3]) / 2;
  // columns spaced by their real widths (plan plus title), equal gaps, Level 3 first
  const order = [...levels].sort((p, q) => q.i - p.i);
  order.forEach(v => { v.l0 = k * (rcy - v.b[1]); v.wd = v.l0 + k * (v.b[3] - rcy) + gap + titleD; });
  const space = (aw - order.reduce((t, v) => t + v.wd, 0)) / 4;
  order.reduce((x, v) => { v.px = x + space + v.l0; v.right = v.px + k * (v.b[3] - rcy); return x + space + v.wd; }, ax0);
  const py = ay0 + ah / 2 + k * (ref[2] - ref[0]) / 2;                     // shared left edge (re-centred below)
  const place = ({ px }) => `translate(${px.toFixed(2)} ${py.toFixed(2)}) rotate(-90) scale(${k.toFixed(5)}) translate(${(-ref[0]).toFixed(2)} ${(-rcy).toFixed(2)})`;
  const L = (id, body, extra = "") => `<g id="${id}" inkscape:groupmode="layer" inkscape:label="${id.replace(/_/g, " ")}"${extra}>${body}</g>`;

  const program = levels.map((v, s) => `<g id="Program_Level_${v.i}" transform="${place(v)}" fill-opacity=".55">` +
    (v.l.program || "").replace(/class="pg-(\w+)"/g, (m, c) => `class="pg-${c}" fill="${(PROG[c] || ["#ccc"])[0]}"`) + `</g>`).join("");
  const plans = levels.map((v, s) => `<g id="Plan_Level_${v.i}" transform="${place(v)}" fill="none">` +
    ["below", "above", "furniture", "fixtures", "openings", "walls", "new"].map(p => v.l[p] ? `<g id="L${v.i}_${p}" ${style[p]}>${v.l[p]}</g>` : "").join("") + `</g>`).join("");
  const labels = levels.map((v, s) => `<g id="Room_names_Level_${v.i}" transform="${place(v)}" font-family="${sans}" font-weight="700" fill="${ink}" stroke="#fff" stroke-width="${w(1.6)}" paint-order="stroke" letter-spacing=".02em">` +
    (v.l.labels || "").replace(/<text([^>]*class="[^"]*dim[^"]*"[^>]*)>[^<]*<\/text>/g, "").replace(/font-size="([\d.]+)"/g, (m, f) => `font-size="${(f * 1.45).toFixed(1)}"`) + `</g>`).join("");

  // per-plan titles and north arrows, drawn in the plan's reading frame and turned with it
  const north = (x, y) => `<g transform="translate(${x} ${y}) rotate(${R.north_cw_from_up.toFixed(1)})"><circle r="17" fill="none" stroke="${ink}" stroke-width="1"/><path d="M0 -15 L6 6 L0 2 L-6 6 Z" fill="${ink}"/></g>` +
    `<text x="${x}" y="${y + 32}" text-anchor="middle" font-family="${sans}" font-size="8" font-weight="700" fill="${ink}">N</text>`;
  const wrap = (t, n) => { const out = []; let cur = ""; t.split(" ").forEach(x => { if ((cur + " " + x).trim().length > n) { out.push(cur); cur = x; } else cur = (cur + " " + x).trim(); }); out.push(cur); return out; };
  const titles = levels.map(v => { const T = TEXT[v.i];
    return `<g id="Title_Level_${v.i}" transform="translate(${(v.right + gap).toFixed(2)} ${py.toFixed(2)}) rotate(-90)"><rect x="0" y="0" width="54" height="20" rx="4" fill="${red}"/>` +
      `<text x="27" y="14" text-anchor="middle" font-family="${sans}" font-size="10" font-weight="700" letter-spacing="1.2" fill="#fff">${T.b.toUpperCase()}</text>` +
      `<text x="64" y="16" font-family="${serif}" font-size="22" font-weight="600" fill="${ink}">${T.h}</text>` +
      wrap(T.p, 92).map((t, j) => `<text x="0" y="${40 + j * 14}" font-family="${sans}" font-size="10" fill="${muted}">${t}</text>`).join("") +
      north(435, 22) + `</g>`; }).join("");

  // title block, same layout as the AS sheets
  const fx0 = M, fy0 = M, fw = W - 2 * M, fh = H - 2 * M, ty0 = fy0 + fh - TB, cols = [7.4, 9.4, null, 8.2].map(v => v && v * PT);
  cols[2] = fw - cols[0] - cols[1] - cols[3];
  const cx = [fx0]; cols.forEach((c, i) => cx.push(cx[i] + c));
  const T = (x, y, t, size, o = "") => `<text x="${x}" y="${y}" font-family="${o.includes("serif") ? serif : sans}" font-size="${size}" ${o.replace("serif", "")}>${t}</text>`;
  const lab = (x, y, t) => T(x, y, t, 9, `font-weight="600" letter-spacing="1.3" fill="${muted}"`);
  const pad = .3 * PT, top = ty0 + .22 * PT + 9;
  let tb = `<rect x="${fx0}" y="${fy0}" width="${fw}" height="${fh}" fill="none" stroke="${ink}" stroke-width="2"/>` +
    `<line x1="${fx0}" y1="${ty0}" x2="${fx0 + fw}" y2="${ty0}" stroke="${ink}" stroke-width="1.5"/>` +
    [1, 2, 3].map(i => `<line x1="${cx[i]}" y1="${ty0}" x2="${cx[i]}" y2="${fy0 + fh}" stroke="${line}" stroke-width="1"/>`).join("");
  // scale column: graphic scale, 0 to 32 ft at 1/16"
  const sx = cx[0] + pad, bar = 16 * (1 / 16) * PT;   // 16 ft = 1"
  tb += lab(sx, top, "SCALE") + T(sx, top + 30, `1/16" = 1'-0"`, 20, `serif font-weight="600" fill="${ink}"`) +
    [0, 1, 2, 3].map(i => `<rect x="${sx + i * bar / 2}" y="${top + 48}" width="${bar / 2}" height="9" fill="${i % 2 ? "#fff" : ink}" stroke="${ink}" stroke-width=".75"/>`).join("") +
    [0, 8, 16, 24, 32].map((v, i) => T(sx + i * bar / 2, top + 72, v + (i === 4 ? " ft" : ""), 9.5, `text-anchor="middle" fill="${ink}"`)).join("") +
    T(sx, top + 100, "North arrow on each plan; plans turned 90° from the study plan sheets.", 10, `fill="${muted}"`);
  // legend: program key plus wall key
  const lx = cx[1] + pad, sw = (x, y, fill, op = .55) => `<rect x="${x}" y="${y - 10}" width="30" height="14" rx="2" fill="${fill}" fill-opacity="${op}"/>`;
  tb += lab(lx, top, "PROGRAM") + Object.values(PROG).map(([c, n], i) => { const x = lx + (i < 3 ? 0 : 3.3 * PT), y = top + 24 + (i % 3) * 22;
    return sw(x, y, c) + T(x + 40, y + 1, n, 12.5, `fill="${ink}"`); }).join("");
  const kx = lx + 6.6 * PT;
  tb += `<line x1="${kx}" y1="${top + 21}" x2="${kx + 30}" y2="${top + 21}" stroke="${ink}" stroke-width="1"/>` + T(kx + 40, top + 25, "Walls kept", 12.5, `fill="${ink}"`) +
    `<line x1="${kx}" y1="${top + 43}" x2="${kx + 30}" y2="${top + 43}" stroke="${red}" stroke-width="2"/>` + T(kx + 40, top + 47, "New at this Level", 12.5, `fill="${ink}"`);
  // notes
  const nx = cx[2] + pad;
  tb += lab(nx, top, "NOTES") + ["Plans from the Red House study plan sheets A1.0 to A1.0-3, aligned Level to Level.",
    "Program colours are an overlay on their own layer (Program colors), one group per Level.",
    "Level 3 repairs the sheet's cropped edges from its own inset and from Level 2.",
    "Planning study for discussion. Not for construction."].map((t, i) => T(nx, top + 24 + i * 17.5, t, 12, `fill="${ink}"`)).join("");
  // title
  const tx0 = cx[3] + pad;
  tb += T(tx0, top + 6, "Agriculture Education Center", 13, `serif font-weight="600" fill="${ink}"`) +
    T(tx0, top + 22, "Clark Farm · 9600 SR-72, Sarasota, Florida", 10.5, `fill="${muted}"`) +
    T(tx0, fy0 + fh - .22 * PT - 22, "Red House: Levels 1 to 3", 30, `serif font-weight="600" fill="${ink}"`) +
    T(tx0, fy0 + fh - .22 * PT, "Stakeholder review draft · Program", 10.5, `fill="${muted}"`) +
    T(tx0 + 3.7 * PT, fy0 + fh - .22 * PT, date, 10.5, `font-weight="600" fill="${ink}"`) +
    T(cx[4] - .55 * PT, fy0 + fh - .22 * PT, `Sheet <tspan font-weight="600" fill="${ink}">A-1</tspan>`, 10.5, `text-anchor="end" fill="${muted}"`) +
    `<text transform="translate(${cx[4] - .12 * PT - 4} ${fy0 + fh - .22 * PT}) rotate(-90)" font-family="${sans}" font-size="10.5" letter-spacing=".8" fill="${muted}">SEIBERT ARCHITECTS</text>`;

  document.body.insertAdjacentHTML("afterbegin",
    `<svg id="sheet" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="36in" height="24in" viewBox="0 0 ${W} ${H}">` +
    `<rect width="${W}" height="${H}" fill="#fff"/>` +
    L("Program_colors", program) + L("Plans", plans) + L("Room_names", labels) + L("Plan_titles", titles) + L("Titleblock", tb) + `</svg>`);
  // centre the drawing (plans, colours, names, titles) in the drawing area on its walls and titles as rendered
  const sh = document.getElementById("sheet"), lay = ["Program_colors", "Plans", "Room_names", "Plan_titles"].map(id => sh.getElementById(id));
  let e = null;
  [...sh.querySelectorAll('[id$="_walls"], [id$="_new"], #Plan_titles')].forEach(g => { const r = g.getBoundingClientRect(), f = 72 / 96;
    if (!r.width) return; r.x = r.left * f; r.y = r.top * f; r.width *= f; r.height *= f; e = e ? [Math.min(e[0], r.x), Math.min(e[1], r.y), Math.max(e[2], r.x + r.width), Math.max(e[3], r.y + r.height)] : [r.x, r.y, r.x + r.width, r.y + r.height]; });
  const dx = (ax0 + aw / 2 - (e[0] + e[2]) / 2).toFixed(2), dy = (ay0 + ah / 2 - (e[1] + e[3]) / 2).toFixed(2);
  lay.forEach(g => g.setAttribute("transform", `translate(${dx} ${dy})`));
  window.SHEET_READY = true;
})();
</script>
</body>
</html>
