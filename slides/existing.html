<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Existing Buildings</title>
<link rel="stylesheet" href="../design/palette.css">
<link rel="stylesheet" href="../design/deck.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 30px; flex: 1; min-height: 0; }
  .b { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .ph { position: relative; flex: 1; min-height: 0; background: #efe9dc; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .empty { position: absolute; inset: 14px; border: 2px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center;
               font: 500 17px/1.5 var(--sans); color: var(--muted); }
  .ph .empty code { font: 600 15px/1 ui-monospace, Menlo, monospace; color: var(--ink); background: #fff; padding: 4px 8px; border-radius: 6px; }
  .cap { padding: 16px 22px 18px; border-top: 6px solid; }
  .cap h2 { font: 600 27px/1.15 var(--serif); margin: 0; }
  .cap p { font: 400 17px/1.4 var(--sans); margin: 5px 0 0; color: var(--muted); }
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow" data-step="0">Act 1 · What we have</div>
  <h1 data-step="0">What is already built</h1>
  <p class="lede" data-step="0">Six existing structures, all near the center of the site.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="../design/deck.js"></script>
<script>
// Site photos: drop JPEGs in /photos with these file names and they replace the placeholders.
const ITEMS = [
  { file: "red-house.jpg", key: "education", name: "The Red House", note: "Former residence with several floor levels and wraparound porches." },
  { file: "barn.jpg", key: "swine", name: "Existing barn", note: "One-story wood-frame building beside the cattle pens." },
  { file: "cattle-pens.jpg", key: "cattle", name: "Seven cattle pens", note: "Covered, dirt-floor horse barn on the east side of the existing barn." },
  { file: "hog-enclosures.jpg", key: "swine", name: "Hog enclosures", note: "Existing outdoor enclosures." },
  { file: "unfinished-barns.jpg", key: "small-animal", name: "Small unfinished barns", note: "Structurally complete, without power or water yet." },
  { file: "corral.jpg", key: "cattle", name: "Corral", note: "Existing corral for working pasture cattle." },
];
document.getElementById("grid").innerHTML = ITEMS.map((it, i) => `
  <article class="card b" data-step="${1 + Math.floor(i / 3)}">
    <div class="ph"><div class="empty"><span>Site photo to come<br><code>photos/${it.file}</code></span></div>
      <img src="../photos/${it.file}" alt="${it.name}" onerror="this.remove()"></div>
    <div class="cap" style="border-top-color:var(--${it.key})"><h2>${it.name}</h2><p>${it.note}</p></div>
  </article>`).join("");
Deck.start();
</script>
</body>
</html>
