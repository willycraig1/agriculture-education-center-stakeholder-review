<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Existing Buildings</title>
<link rel="stylesheet" href="../design/palette.css?v=202610150131">
<link rel="stylesheet" href="../design/deck.css?v=202610150131">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 30px; flex: 1; min-height: 0; }
  .b { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .ph { position: relative; flex: 1; min-height: 0; background: #efe9dc; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .empty { position: absolute; inset: 14px; border: 2px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center;
               font: 500 17px/1.5 var(--sans); color: var(--muted); }
  .ph .empty code { font: 600 15px/1 ui-monospace, Menlo, monospace; color: var(--ink); background: #fff; padding: 4px 8px; border-radius: 6px; }
  .cap { padding: 16px 22px 18px; border-top: 6px solid; }
  .cap h2 { font: 600 27px/1.15 var(--serif); margin: 0; }
  .cap p { font: 400 17px/1.4 var(--sans); margin: 5px 0 0; color: var(--muted); }
</style>
</head>
<body data-drivers="reuse">
<div class="stage">
  <div class="eyebrow" data-step="0">Act 1 · What we have</div>
  <h1 data-step="0">What is already built</h1>
  <p class="lede" data-step="0">Six existing structures, all near the center of the site.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="../design/deck.js?v=202610150131"></script>
<script>
// Site photos: drop images in /photos with these base names (.jpg, .jpeg or .png) and they replace the placeholders.
const EXTS = [".jpg", ".jpeg", ".png", ".JPG", ".JPEG"];
function nextExt(img) { const k = +img.dataset.try + 1; if (k >= EXTS.length) return img.remove(); img.dataset.try = k; img.src = img.dataset.base + EXTS[k]; }
const ITEMS = [
  { file: "red-house", key: "education", name: "The Red House", note: "Former residence under the oaks, with several floor levels and wraparound porches." },
  { file: "barn", key: "swine", name: "Existing barn", note: "Wood-sided barn with four roll-up doors and a concrete apron." },
  { file: "cattle-pens", key: "cattle", name: "Seven cattle pens", note: "Timber pens along a covered aisle with fans overhead, on the east side of the existing barn." },
  { file: "hog-enclosures", key: "swine", name: "Hog enclosures", note: "Long open-sided timber shed, out in the pasture." },
  { file: "unfinished-barns", key: "small-animal", name: "Small unfinished barns", note: "Open timber frames with new metal roofs, not yet served by power or water." },
  { file: "corral", key: "cattle", name: "Squeeze chute", note: "A chute and gates in a small holding pen, for working pasture cattle." },
];
document.getElementById("grid").innerHTML = ITEMS.map((it, i) => `
  <article class="card b" data-step="${1 + Math.floor(i / 3)}">
    <div class="ph"><div class="empty"><span>Site photo to come<br><code>photos/${it.file}.jpg</code></span></div>
      <img src="../photos/${it.file}.jpg" alt="${it.name}" data-base="../photos/${it.file}" data-try="0" onerror="nextExt(this)"></div>
    <div class="cap" style="border-top-color:var(--${it.key})"><h2>${it.name}</h2><p>${it.note}</p></div>
  </article>`).join("");
Deck.start();
</script>
</body>
</html>
