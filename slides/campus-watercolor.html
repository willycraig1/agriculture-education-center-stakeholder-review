<style>
  /* the architect's aerial watercolour of the campus (2026-10-20), alone on the slide: full height, centred,
     multiplied into the paper with its painted edges feathered, as on the cover */
  .art { position: absolute; inset: 0; display: grid; place-items: center; }
  .art img { height: 100%; width: auto; mix-blend-mode: multiply;
             -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent), linear-gradient(transparent 0, #000 6%, #000 94%, transparent);
             -webkit-mask-composite: source-in;
             mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent), linear-gradient(transparent 0, #000 6%, #000 94%, transparent);
             mask-composite: intersect; }
</style>
</head>
