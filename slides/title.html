<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title</title>
<link rel="stylesheet" href="../design/palette.css?v=202610211436">
<link rel="stylesheet" href="../design/deck.css?v=202610211436">
<style>
  .stage { justify-content: center; padding: 96px 120px; }
  .title { font: 600 104px/1.0 var(--serif); margin: 18px 0 26px; letter-spacing: -.015em; max-width: 14ch; }
  .sub { font: 400 32px/1.35 var(--sans); color: var(--muted); max-width: 46ch; margin: 0; }
  .strip { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 64px; width: 820px; }
  .strip i { flex: 1; }
  .meta { display: flex; gap: 48px; margin-top: 34px; font: 500 20px/1.4 var(--sans); color: var(--muted); }
  .meta b { display: block; color: var(--ink); font-weight: 600; }
  /* cover watercolour ("Leading a heifer", 2026-10-20): shown whole on the right, multiplied into the paper, its
     painted edges feathered on all four sides so no paper box shows */
  .art { position: absolute; right: 30px; top: 50%; width: 1060px; margin-top: -298px; }
  .art img { display: block; width: 100%; height: auto; mix-blend-mode: multiply;
             -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 95%, transparent), linear-gradient(transparent 0, #000 7%, #000 93%, transparent);
             -webkit-mask-composite: source-in;
             mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 95%, transparent), linear-gradient(transparent 0, #000 7%, #000 93%, transparent);
             mask-composite: intersect; }
  .title { max-width: 9ch; }
  .sub { max-width: 30ch; }
  .strip { width: 680px; }
  .stage > :not(.art) { position: relative; max-width: 760px; }
</style>
</head>
<body class="no-firm">
<div class="stage">
  <div class="art" data-step="0"><img src="../photos/cover-heifer-watercolor.webp" alt="Watercolour of a student leading a red heifer across the grass in front of an open-sided cattle barn with red siding and metal pipe-rail pens, live oaks and palms beyond, cattle on pasture at left"></div>
  <div class="eyebrow" data-step="0">Clark Farm · 9600 SR-72, Sarasota</div>
  <div class="title" data-step="0">Agriculture Education Center</div>
  <p class="sub" data-step="0">Beginning Farmer and 4-H Youth Agriculture Complex. Master plan study for stakeholder review.</p>
  <div class="strip" data-step="0">
    <i style="background:var(--pasture)"></i><i style="background:var(--woodland)"></i><i style="background:var(--cattle)"></i>
    <i style="background:var(--education)"></i><i style="background:var(--small-animal)"></i><i style="background:var(--swine)"></i>
    <i style="background:var(--arena)"></i><i style="background:var(--horticulture)"></i><i style="background:var(--water)"></i>
  </div>
  <div class="meta" data-step="0">
    <div><b>Stakeholder review</b>October 21, 2026 · 5:30 pm<br>Extension Green Room</div>
    <div><b>Seibert Architects</b>Project 2601</div>
  </div>
</div>
<script src="../design/deck.js?v=202610211436"></script>
<script>Deck.start();</script>
</body>
</html>
